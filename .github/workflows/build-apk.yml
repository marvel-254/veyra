name: Build APK

# Triggers:
#  - manual dispatch (with optional version input)
#  - push a v* tag  -> builds, tags a GitHub Release with the APK attached
#  - push to main   -> builds a CI APK artifact (no release)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0). Leave blank for a CI-only build.'
        required: false
        type: string

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      # ── Web build (static export -> apps/web/out) ─────────────────────
      - name: Build web app (static export)
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_MOCK_API: 'false'

      - name: Verify static export output
        run: |
          test -f apps/web/out/index.html || {
            echo "::error::apps/web/out/index.html not found — static export failed"
            ls -la apps/web/out 2>/dev/null || echo "no out/ directory"
            exit 1
          }

      # ── Capacitor sync (copy web assets into the Android project) ─────
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # ── Gradle build ──────────────────────────────────────────────────
      - name: Build debug APK
        run: |
          cd apps/web/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ── Signed release APK ────────────────────────────────────────────
      # Requires a keystore stored as a base64 secret (KEYSTORE_BASE64).
      # Without it we still ship a debug-signed APK so releases never block.
      - name: Decode release keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd apps/web/android
          cat > signing.properties <<EOF
          storeFile=${{ steps.keystore.outputs.KEYSTORE_PATH }}
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.properties=signing.properties

      - name: Locate APK outputs
        id: apk
        run: |
          mkdir -p artifacts
          FOUND=""
          for candidate in \
            apps/web/android/app/build/outputs/apk/release/app-release.apk \
            apps/web/android/app/build/outputs/apk/debug/app-debug.apk; do
            if [ -f "$candidate" ]; then
              cp "$candidate" "artifacts/veyra-$(basename "$candidate")"
              FOUND="$FOUND $candidate"
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::No APK produced by Gradle"
            find apps/web/android/app/build/outputs -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          echo "Built:$FOUND"
          ls -la artifacts/

      # ── PR / main CI artifact ─────────────────────────────────────────
      - name: Upload APK artifact (CI)
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: veyra-apk
          path: artifacts/*.apk
          retention-days: 14

      # ── Tag push -> GitHub Release ────────────────────────────────────
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          body: |
            ## Veyra ${{ github.ref_name }}

            Android APK for Veyra — free streaming and downloads, no account needed.

            ### Install
            1. Download the `.apk` below
            2. Allow installs from your file manager when prompted
            3. Open the APK and install

            > Veyra requires Android 7.0 (API 24) or newer.
            > Veyra is not on the Play Store — sideloading is expected.

            **Checksums**
            ```
            $(sha256sum artifacts/*.apk 2>/dev/null || echo "see release assets")
            ```