name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # ── Web build → static export (apps/web/out/) ─────────────────────────
      - name: Build web app
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://veyra-api-production.kipkiruigideon890.workers.dev' }}
          # Never silently fall back to in-browser mock data in shipped builds.
          NEXT_PUBLIC_MOCK_API: 'false'

      - name: Verify static export output
        run: |
          test -f apps/web/out/index.html && echo "✓ out/index.html found" \
            || { echo "::error::apps/web/out/index.html not found — next build may have failed"; ls apps/web/out/ 2>/dev/null; exit 1; }

      # ── Capacitor: sync from apps/web (not android/) ─────────────────────
      - name: Sync Capacitor
        run: |
          npx cap sync android
        working-directory: apps/web

      # ── Remove google-services plugin (Firebase auth removed) ────────────
      - name: Patch build.gradle (remove Firebase/google-services)
        run: |
          if grep -q "google-services" apps/web/android/build.gradle; then
            sed -i "/google-services/d" apps/web/android/build.gradle
            echo "✓ google-services plugin removed"
          else
            echo "✓ no google-services plugin found"
          fi
          if grep -q "google-services.json" apps/web/android/app/build.gradle; then
            sed -i '/google-services.json/d' apps/web/android/app/build.gradle
            echo "✓ google-services.json removed from app/build.gradle"
          fi

      # ── Gradle: build debug APK ─────────────────────────────────────────
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: apps/web/android

      # ── Copy APK to artifacts dir ────────────────────────────────────────
      - name: Locate and copy APK
        id: apk
        run: |
          mkdir -p artifacts
          DEBUG_APK="apps/web/android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="apps/web/android/app/build/outputs/apk/release/app-release.apk"

          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" artifacts/veyra-app-debug.apk
            echo "✓ Debug APK: artifacts/veyra-app-debug.apk"
          fi
          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" artifacts/veyra-app-release.apk
            echo "✓ Release APK: artifacts/veyra-app-release.apk"
          fi

          if [ ! -f "artifacts/veyra-app-debug.apk" ] && [ ! -f "artifacts/veyra-app-release.apk" ]; then
            echo "::error::No APK produced"
            find apps/web/android -name '*.apk' 2>/dev/null
            exit 1
          fi
          ls -lh artifacts/

      # ── Upload artifact on every push/PR ─────────────────────────────────
      - name: Upload APK artifact
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: veyra-apk
          path: artifacts/*.apk
          retention-days: 14

      # ── Publish GitHub Release on tag push ───────────────────────────────
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          body: |
            ## Veyra ${{ github.ref_name }}

            Android APK — free streaming & downloads, no account needed.

            ### Install
            1. Download the `.apk` below
            2. Enable **Install from unknown sources** in Android Settings → Apps
            3. Open the file and install

            Veyra requires **Android 7.0 (API 24)** or newer.
            Sideloading is expected — Veyra is not on the Play Store.

            ### Checksums
            ```
            $ sha256sum artifacts/*.apk
            ```
